<mat-card class="form-container">

<h2>{{ route.snapshot.paramMap.get('id') ? 'Edit Template' : 'Create Template' }}</h2>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Template Name</mat-label>
    <input matInput [(ngModel)]="templateName">
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Template Type</mat-label>
    <mat-select [(ngModel)]="templateType">
      <mat-option value="STANDARD">Standard</mat-option>
      <mat-option value="SHIFT">Shift</mat-option>
      <mat-option value="FLEXIBLE">Flexible</mat-option>
    </mat-select>
  </mat-form-field>

  <h3>Weekly Schedule</h3>

  <div class="week-grid">
    <div class="day-row" *ngFor="let d of days">

      <div class="day-name">{{ d.name }}</div>

      <mat-checkbox [(ngModel)]="d.working">Working</mat-checkbox>

      <mat-form-field appearance="outline" class="time-field" *ngIf="d.working">
        <mat-label>Start</mat-label>
        <input matInput type="time" [(ngModel)]="d.start">
      </mat-form-field>

      <mat-form-field appearance="outline" class="time-field" *ngIf="d.working">
        <mat-label>End</mat-label>
        <input matInput type="time" [(ngModel)]="d.end">
      </mat-form-field>

      <mat-form-field appearance="outline" class="shift-field" *ngIf="d.working">
        <mat-label>Shift Type</mat-label>
        <mat-select [(ngModel)]="d.shift">
          <mat-option *ngFor="let s of shiftTypes" [value]="s">
            {{ s }}
          </mat-option>
        </mat-select>
      </mat-form-field>

    </div>
  </div>

  <button mat-raised-button color="primary" (click)="saveTemplate()">
    Save Template
  </button>

</mat-card>
